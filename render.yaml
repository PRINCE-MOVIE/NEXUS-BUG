services:
  - type: web
    name: nexus-crasher
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_NUMBER
        sync: false
      - key: SESSION_ID
        sync: false
      - key: BOT_NAME
        value: ɴᴇxᴜs ᴄʀᴀsʜᴇʀ
      - key: APP_URL
        value: https://nexus-crasher.onrender.com
